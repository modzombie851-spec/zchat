name = "zchat-games"
main = "src/index.js"
compatibility_date = "2025-09-01"
keep_vars = true
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "PING"
class_name = "Ping"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby", "Ping"]

[observability]
enabled = false
